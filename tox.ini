# Task runner for the whole repo. Run `tox` for every check CI runs, or pick an
# environment with `tox -e <name>`:
#
#   dev             start the dev stack (db, mailpit, backend, frontend) in docker
#   down            stop the dev stack
#   seed            seed the running dev stack with users and libraries
#   backend-lint    ruff lint + format check (incl. import sorting)
#   backend-types   ty type check
#   backend-test    pytest with the 90% coverage gate (needs Postgres: `docker compose up -d db`)
#   frontend        typecheck, Biome, and Vitest with the 90% coverage gate
#
# Python tooling runs through uv against backend/uv.lock, so tox itself needs
# no Python dependencies.

[tox]
env_list = backend-lint, backend-types, backend-test, frontend
skip_missing_interpreters = true

[testenv]
skip_install = true
package = skip
pass_env = *

[testenv:dev]
description = Start the local dev stack (backend + frontend) with docker compose
allowlist_externals = docker
commands = docker compose up --build {posargs}

[testenv:down]
description = Stop the local dev stack
allowlist_externals = docker
commands = docker compose down {posargs}

[testenv:seed]
description = Seed the running dev stack with demo users and libraries
allowlist_externals = docker
commands = docker compose exec backend python manage.py seed {posargs}

[testenv:backend-lint]
description = Ruff lint, import sorting and format check
change_dir = {tox_root}/backend
allowlist_externals = uv
commands =
    uv run --locked ruff check .
    uv run --locked ruff format --check .

[testenv:backend-types]
description = ty type check
change_dir = {tox_root}/backend
allowlist_externals = uv
commands = uv run --locked ty check

[testenv:backend-test]
description = Backend tests with coverage (fails under 90%)
change_dir = {tox_root}/backend
allowlist_externals = uv
set_env =
    DATABASE_URL = {env:DATABASE_URL:postgres://dotcraft:dotcraft@localhost:5432/dotcraft}
commands =
    uv run --locked python manage.py makemigrations --check --dry-run --settings=config.settings_test
    uv run --locked pytest --cov --cov-report=term-missing {posargs}

[testenv:frontend]
description = Frontend typecheck, lint and tests with coverage
change_dir = {tox_root}/frontend
allowlist_externals = bun
commands =
    bun install --frozen-lockfile
    bun run typecheck
    bun run check
    bun run test:coverage
